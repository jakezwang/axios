name: Axios 11216 Ubuntu candidate validation

on:
  push:
    branches: [audit/axios-11216-ubuntu-20261009]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 18bbc6bfa7c241ccfcfcf43fd598c851938d911b
          persist-credentials: false
      - name: Verify candidate commit
        run: test "$(git rev-parse HEAD)" = 18bbc6bfa7c241ccfcfcf43fd598c851938d911b
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.x
          package-manager-cache: false
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps
      - name: Full unit suite
        run: npm run test:vitest:unit
      - name: Full headless browser suite
        run: npm run test:vitest:browser:headless
